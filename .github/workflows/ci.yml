name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write # publish test results as annotations

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit.xml "test/**/*.test.ts"
      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: junit.xml
          check_name: tests (${{ matrix.os }}, node ${{ matrix.node }})
          annotate_only: true
          detailed_summary: true
      - run: npm run validate

  package:
    name: package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: API docs build without warnings
        run: npm run lint:docs
      - name: Check published file list
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("pack.json","utf8"))[0].files.map(f => f.path);
            const must = ["dist/cli.js", "presets/github.json", "tools/codex/tool.json", "schemas/server.schema.json", "templates/secrets.env.example", "README.md", "LICENSE"];
            const missing = must.filter(m => !files.includes(m));
            const leaked = files.filter(f => /^(src|test|scripts|\.github|docs)\//.test(f) || f.endsWith(".env"));
            if (missing.length || leaked.length) { console.error({ missing, leaked }); process.exit(1); }
            console.log(files.length + " files OK");'
      - name: Install tarball and run
        run: |
          npm pack
          npm install -g ./wirebay-*.tgz
          export WIREBAY_USER_HOME="$RUNNER_TEMP/home" WIREBAY_HOME="$RUNNER_TEMP/home/.wirebay"
          wirebay --version
          wirebay init
          wirebay presets
          wirebay doctor --offline --json

  secrets-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
