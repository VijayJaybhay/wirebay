name: "🐛 Bug report"
description: Something doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "⚠️ Never paste tokens, secrets.env, or unredacted tool configs. `wirebay doctor --json` output is safe to share."
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, placeholder: "wirebay add github to codex …" }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: wirebay --version }
    validations: { required: true }
  - type: input
    id: os
    attributes: { label: OS and Node version }
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: Output of `wirebay doctor --json`
      render: json
